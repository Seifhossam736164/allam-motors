<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | علم موتورز</title>
<link rel="icon" type="image/jpeg" href="images/logo.jpeg">
<link rel="stylesheet" href="css/style.css">

<style>

.details{

padding:130px 8% 60px;

display:grid;

grid-template-columns:1fr 1fr;

gap:50px;

}

.gallery img{

width:100%;

height:450px;

object-fit:cover;

border-radius:15px;

}

.thumbs{

display:flex;

gap:10px;

margin-top:15px;

}

.thumbs img{

width:90px;

height:90px;

cursor:pointer;

border-radius:10px;

transition:.3s;

}

.thumbs img:hover{

transform:scale(1.08);

}

.info h1{

font-size:42px;

margin-bottom:15px;

}

.price{

font-size:35px;

color:#ff0000;

margin-bottom:20px;

font-weight:bold;

}

.info ul{

line-height:2.2;

font-size:20px;

}

.btns{

margin-top:35px;

display:flex;

gap:20px;

flex-wrap:wrap;

}

.buy{

background:#ff0000;

color:#fff;

padding:15px 35px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:18px;

}

.whatsapp{

background:#25D366;

color:#fff;

padding:15px 35px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:18px;

}

@media(max-width:900px){

.details{

grid-template-columns:1fr;

}

.gallery img{

height:300px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
<h2>🏍️ علام موتورز</h2>
</div>

<nav>

<a href="index.html">الرئيسية</a>
<a href="products.html?category=motorcycles">الموتوسيكلات</a>

<a href="products.html?category=scooters">السكوترات</a>

<a href="products.html?category=parts">قطع الغيار</a>

<a href="products.html?category=accessories">الإكسسوارات</a>
<a href="#" onclick="openContact(); return false;">اتصل بنا</a>

</nav>

<a href="cart.html" class="cart-link">
    🛒 السلة
</a>

</header>

<section class="details">

    <div class="gallery">

        <img id="mainImage" src="" alt="صورة المنتج">

        <div class="thumbs" id="thumbnails"></div>

    </div>

    <div class="info">

        <h1 id="productName"></h1>

        <div class="price" id="productPrice"></div>

        <p id="productDescription"></p>

        <ul id="productSpecs"></ul>

        <div class="btns">

            <button class="buy" id="addToCart">
                🛒 أضف للسلة
            </button>

            <button class="whatsapp" id="whatsapp">
				
<a href="https://wa.me/201070360693" target="_blank">
				
                📞 تواصل معنا
            </button>

        </div>

    </div>

</section>

<script src="js/products.js"></script>
<script src="js/details.js"></script>

</body>

</html>
