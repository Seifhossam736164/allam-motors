<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المفضلة | علام موتورز</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;

    padding: 20px 7%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo h2 {
    margin: 0;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

.favorites {
    min-height: 70vh;

    padding: 60px 7%;
}

.favorites h1 {
    text-align: center;

    margin-bottom: 40px;

    font-size: 36px;
}

.favorite-box {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));

    gap: 25px;
}

.favorite-card {
    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow: 0 5px 20px rgba(0,0,0,.1);

    padding-bottom: 20px;
}

.favorite-card img {
    width: 100%;

    height: 220px;

    object-fit: cover;
}

.favorite-card h3 {
    margin: 15px 20px 5px;

    font-size: 21px;
}

.favorite-card .price {
    margin: 0 20px 15px;

    color: #e00000;

    font-size: 19px;

    font-weight: bold;
}

.favorite-actions {
    display: flex;

    gap: 10px;

    padding: 0 20px;
}

.favorite-actions a,
.favorite-actions button {
    flex: 1;

    padding: 11px;

    border: none;

    border-radius: 8px;

    text-align: center;

    text-decoration: none;

    cursor: pointer;

    font-size: 15px;
}

.details-btn {
    background: #111;

    color: white;
}

.remove-btn {
    background: #ffe5e5;

    color: #d00000;
}

.empty-favorites {
    background: white;

    padding: 60px 20px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.empty-favorites h2 {
    font-size: 30px;
}

.empty-favorites p {
    color: #777;

    margin-bottom: 25px;
}

.empty-favorites a {
    display: inline-block;

    background: #e00000;

    color: white;

    text-decoration: none;

    padding: 13px 25px;

    border-radius: 9px;
}

footer {
    background: #111;

    color: white;

    text-align: center;

    padding: 30px;

    margin-top: 50px;
}

@media (max-width: 700px) {

    header {
        flex-direction: column;
    }

    .favorites {
        padding: 40px 15px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

<h2>🏍️ علام موتورز</h2>

</div>

<nav>

<a href="index.html">
الرئيسية
</a>

<a href="products.html">
المنتجات
</a>

<a href="cart.html">
🛒 السلة
</a>

<a href="favorites.html">
❤️ المفضلة
</a>

</nav>

</header>


<main class="favorites">

<h1>
❤️ المفضلة
</h1>

<div
class="favorite-box"
id="favoriteContainer">
</div>

</main>


<footer>

<h2>
علام موتورز
</h2>

<p>
كل ما يخص الموتورسيكلات والسكوترات في مكان واحد.
</p>

<p>
© 2026 Allam Motors
</p>

</footer>


<script src="js/products.js"></script>

<script src="js/favorites.js"></script>

</body>

</html>
