<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="images/logo.jpeg">
<title>إتمام الطلب | علام موتورز</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;

    padding: 20px 7%;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo h2 {
    margin: 0;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

.checkout {
    max-width: 1000px;
    margin: auto;

    padding: 60px 20px;
}

.checkout h1 {
    text-align: center;
    margin-bottom: 40px;
}

.checkout-box {
    background: white;

    border-radius: 18px;

    padding: 30px;

    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.checkout-box h2 {
    margin-top: 0;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 16px;

    outline: none;
}

.form-group textarea {
    height: 120px;

    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #111;
}

.order-summary {
    margin-top: 35px;

    padding-top: 25px;

    border-top: 1px solid #ddd;
}

.order-item {
    display: flex;

    justify-content: space-between;

    padding: 12px 0;

    border-bottom: 1px solid #eee;
}

.order-total {
    display: flex;

    justify-content: space-between;

    margin-top: 25px;

    font-size: 22px;

    font-weight: bold;
}

.confirm-btn {
    width: 100%;

    margin-top: 30px;

    padding: 16px;

    border: none;

    border-radius: 10px;

    background: #e00000;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

.confirm-btn:hover {
    opacity: .9;
}

.empty-message {
    text-align: center;

    padding: 40px;
}

.empty-message a {
    color: #e00000;

    font-weight: bold;

    text-decoration: none;
}

footer {
    background: #111;

    color: white;

    text-align: center;

    padding: 30px;

    margin-top: 50px;
}

@media (max-width: 700px) {

    header {
        flex-direction: column;

        gap: 15px;
    }

    .checkout {
        padding: 40px 15px;
    }

    .checkout-box {
        padding: 20px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

<h2>🏍️ علام موتورز</h2>

</div>

<nav>

<a href="index.html">
الرئيسية
</a>

<a href="products.html?category=motorcycles">
الموتورسيكلات
</a>

<a href="products.html?category=scooters">
السكوترات
</a>

<a href="cart.html">
🛒 السلة
</a>

</nav>

</header>


<main class="checkout">

<h1>
📝 إتمام الطلب
</h1>

<div class="checkout-box">

<h2>
بيانات العميل
</h2>

<form id="checkoutForm">

<div class="form-group">

<label>
الاسم بالكامل
</label>

<input
type="text"
id="customerName"
placeholder="اكتب اسمك"
required
>

</div>


<div class="form-group">

<label>
رقم الموبايل
</label>

<input
type="tel"
id="customerPhone"
placeholder="01xxxxxxxxx"
required
>

</div>


<div class="form-group">

<label>
المحافظة
</label>

<select id="governorate" required>

<option value="">
اختر المحافظة
</option>

<option>القاهرة</option>
<option>الجيزة</option>
<option>القليوبية</option>
<option>الإسكندرية</option>
<option>الدقهلية</option>
<option>الشرقية</option>
<option>الغربية</option>
<option>المنوفية</option>
<option>البحيرة</option>
<option>كفر الشيخ</option>
<option>دمياط</option>
<option>بورسعيد</option>
<option>الإسماعيلية</option>
<option>السويس</option>
<option>الفيوم</option>
<option>بني سويف</option>
<option>المنيا</option>
<option>أسيوط</option>
<option>سوهاج</option>
<option>قنا</option>
<option>الأقصر</option>
<option>أسوان</option>
<option>البحر الأحمر</option>
<option>الوادي الجديد</option>
<option>مطروح</option>
<option>شمال سيناء</option>
<option>جنوب سيناء</option>

</select>

</div>


<div class="form-group">

<label>
العنوان بالتفصيل
</label>

<textarea
id="address"
placeholder="المنطقة - الشارع - رقم العقار - الدور..."
required
></textarea>

</div>


<div class="form-group">

<label>
ملاحظات على الطلب
</label>

<textarea
id="notes"
placeholder="أي ملاحظات إضافية..."
></textarea>

</div>


<div class="order-summary">

<h2>
ملخص الطلب
</h2>

<div id="orderItems"></div>

<div class="order-total">

<span>
الإجمالي
</span>

<span>
<span id="orderTotal">0</span>
جنيه
</span>

</div>

</div>


<button
type="submit"
class="confirm-btn"
>
تأكيد الطلب
</button>

</form>

</div>

</main>


<footer>

<h2>
علام موتورز
</h2>

<p>
كل ما يخص الموتورسيكلات والسكوترات في مكان واحد.
</p>

<p>
© 2026 Allam Motors
</p>

</footer>


<script src="js/products.js"></script>

<script src="js/checkout.js"></script>

</body>

</html>
