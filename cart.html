<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="images/logo.jpeg">
<title>السلة | علام موتورز</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #222222;
    color: white;
}

/* HEADER */

header {
    background: #111;
    color: white;
    padding: 20px 7%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo h2 {
    margin: 0;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

/* CART */

.cart-section {
    min-height: 70vh;
    padding: 60px 7%;
}

.cart-section h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 40px;
}

/* PRODUCT */

.cart-item {
    background: black;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 20px;

    display: flex;

    align-items: center;

    gap: 25px;

    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

.cart-item img {
    width: 180px;
    height: 130px;

    object-fit: cover;

    border-radius: 14px;
}

.cart-info {
    flex: 1;
}

.cart-info h3 {
    font-size: 24px;
    margin-top: 0;
}

.cart-info p {
    color: white;
}

/* QUANTITY */

.quantity {
    display: flex;

    align-items: center;

    gap: 10px;

    margin: 15px 0;
}

.quantity button {
    width: 40px;
    height: 40px;

    border: none;

    border-radius: 8px;

    background: #ff0000;

    color: white;

    font-size: 22px;

    cursor: pointer;
}

.quantity span {
    min-width: 30px;

    text-align: center;

    font-size: 20px;

    font-weight: bold;
}

/* DELETE */

.remove {
    border: none;

    background: #ffe5e5;

    color: #d00000;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;
}

/* TOTAL */

.cart-total {
    background: #111;

    color: white;

    padding: 25px;

    border-radius: 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 30px;
}

.cart-total h2 {
    margin: 0;
}

.cart-total button {
    border: none;

    background: #e00000;

    color: white;

    padding: 15px 30px;

    border-radius: 10px;

    font-size: 17px;

    cursor: pointer;
}

/* EMPTY */

.empty-cart {
    background: white;

    border-radius: 18px;

    text-align: center;

    padding: 60px 20px;

    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.empty-cart h2 {
    font-size: 30px;
}

.empty-cart p {
    color: #777;
}

.empty-cart a {
    display: inline-block;

    background: #e00000;

    color: white;

    text-decoration: none;

    padding: 13px 25px;

    border-radius: 9px;
}

/* FOOTER */

footer {
    background: #111;

    color: white;

    text-align: center;

    padding: 30px;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        flex-direction: column;
    }

    nav {
        justify-content: center;
    }

    .cart-section {
        padding: 40px 15px;
    }

    .cart-item {
        flex-direction: column;

        text-align: center;
    }

    .cart-item img {
        width: 100%;

        height: 220px;
    }

    .quantity {
        justify-content: center;
    }

    .cart-total {
        flex-direction: column;

        gap: 20px;

        text-align: center;
    }

    .cart-total button {
        width: 100%;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

<h2>🏍️ علام موتورز</h2>

</div>

<nav>

<a href="index.html">
الرئيسية
</a>

<a href="products.html?category=motorcycles">
الموتورسيكلات
</a>

<a href="products.html?category=scooters">
السكوترات
</a>

<a href="products.html?category=parts">
قطع الغيار
</a>

<a href="products.html?category=accessories">
الإكسسوارات
</a>

</nav>

</header>

<main class="cart-section">

<h1>
🛒 سلة المشتريات
</h1>

<div id="cartContainer"></div>

<div class="cart-total">

<h2>

الإجمالي:

<span id="cartTotal">
0
</span>

جنيه

</h2>

<button id="checkoutBtn">

إتمام الطلب

</button>

</div>

</main>

<footer>

<h2>
علام موتورز
</h2>

<p>
كل ما يخص الموتورسيكلات والسكوترات في مكان واحد.
</p>

<p>
© 2026 Allam Motors
</p>

</footer>

<script src="js/products.js"></script>

<script src="js/cart.js"></script>

</body>

</html>
